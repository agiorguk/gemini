name: build dev adocs

on:
  push:
    branches:
    - dev
    - dev-agi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adoc_build-dataset:
    runs-on: ubuntu-latest
    name: Asciidoctor conversion, dataset variant
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build datasets variant
      id: adocbuild-datasets
      run: >-
        docker run --rm -v "${{ github.workspace }}:/documents"
        asciidoctor/docker-asciidoctor:1.108.1@sha256:0b75447cc4b616e18746a77cd2739ec4eedc0d2fb3d7e6db121a9dd2dd9dc078
        asciidoctor -a docinfo1 -T docs/templates -E slim 'docs/*.asciidoc' 'docs/*.adoc'
    - name: Deploy docs to ghpages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with: 
        personal_token: ${{ secrets.API_TOKEN_GITHUB }}
        external_repository: agiorguk/gemini-dev
        publish_branch: gh-pages
        publish_dir: ./docs/
        enable_jekyll: true
